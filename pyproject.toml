[project]
name = "option-strategy"
version = "0.1.0"
description = "Personal semi-automated options trading desk (Fyers, multi-broker later)"
requires-python = ">=3.12"
dependencies = [
    "fyers-apiv3>=3.1.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.31",
    "pyotp>=2.9",
    # Shark's public tick stream is socket.io, not raw WebSocket, so a WebSocket
    # client cannot speak it. Pure Python, and its aiohttp transport is already
    # here via the Fyers SDK - see broker/shark/stream.py.
    "python-socketio[asyncio_client]>=5.11",
    # Held below 4.11 deliberately. fyers-apiv3 pins aiohttp==3.9.3 exactly, and
    # from 4.11 engineio calls aiohttp.ClientWSTimeout, which 3.9 does not have -
    # so a newer engineio installs cleanly and then fails at connect time with an
    # AttributeError. 4.9.1 speaks the same protocol against the same venue;
    # verified streaming all three instruments.
    #
    # The alternative is overriding the SDK's exact aiohttp pin. That is the wrong
    # risk to take for this: aiohttp is what Fyers' own websocket runs on, and
    # upgrading a dependency a vendor pinned exactly, to fix something in a
    # different venue's stream, is how the options desk breaks quietly.
    "python-engineio<4.11",
    # An explicit CA bundle for that stream: aiohttp's default SSL context could
    # not verify the venue's certificate on macOS.
    "certifi>=2024.2",
    # Historical bars, kept so a chart does not re-ask a rate-limited source for
    # candles it already has. Columnar, which is what a few million bars want, and
    # its Parquet support is the escape hatch if this data outgrows the app.
    #
    # The largest dependency here after the AWS SDK the Fyers SDK drags in. SQLite
    # would hold bars too; DuckDB earns the size on range scans over long
    # histories, which is what every chart request is.
    "duckdb>=1.1",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
# Two conftest.py files (tests/api, tests/strategies) are the same module name
# to mypy unless it is told to derive package names from the directory layout.
# The alternative is __init__.py files in every test directory, which changes
# how pytest imports them for no benefit.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
files = [
    "backtest",
    "broker",
    "analytics",
    "risk",
    "strategies",
    "storage",
    "execution",
    "optbt",
    "scripts",
    "api",
    "tests",
    "settings.py",
]

# The ML stack: joblib and LightGBM ship no py.typed marker, and are used from
# backtest/ml.py alone.
[[tool.mypy.overrides]]
module = ["joblib.*", "lightgbm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fyers_apiv3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

# python-socketio ships no py.typed marker. Its surface here is two calls (`on`
# and `emit`) plus `connect`/`disconnect`, all used from one module.
[[tool.mypy.overrides]]
module = "socketio.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["broker", "analytics", "risk", "strategies", "storage", "execution", "api", "optbt"]
